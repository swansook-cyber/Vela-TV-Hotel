name: Hotel Foundation CI
on:
  push:
    branches: [develop/hotel-v0.1-foundation, 'fix/hotel-*', 'feature/hotel-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and test backend and staging package
        run: |
          python -m compileall -q backend
          python -m compileall -q deploy/homehub-staging/backup_restore.py
          bash -n deploy/homehub-staging/*.sh
          python -m unittest discover -s backend -p 'test_*.py' -v
