name: Hotel Foundation CI
on:
  push:
    branches: [develop/hotel-v0.1-foundation, 'fix/hotel-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test backend prototype
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend -p 'test_*.py' -v
