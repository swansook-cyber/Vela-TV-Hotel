name: Hotel Foundation CI
on:
  push:
    branches: [develop/hotel-v0.1-foundation, 'fix/hotel-*', 'feature/hotel-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned schema test dependency
        run: python -m pip install -r backend/requirements-test.txt
      - name: Compile and test backend prototype
        run: |
          python -m compileall -q backend
          python -m unittest discover -s backend -p 'test_*.py' -v
  windows-installer-static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows scripts and reject placeholder pilot host
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem ops/windows/*.ps1)) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "$($file.Name): $($errors | Select-Object -ExpandProperty Message)" }
          }
          $result = & pwsh -NoProfile -File ops/windows/Preflight-Pilot.ps1 -PilotHost hotel-tv.example.com -BackupDestination $env:TEMP -PythonExe 'C:\absent\python.exe' 2>&1
          if ($LASTEXITCODE -ne 1 -or ($result -join "`n") -notmatch 'FAIL hostname') {
            throw 'Preflight did not reject a placeholder hostname'
          }
