name: Hotel Android Debug CI
on:
  push:
    branches:
      - develop/hotel-v0.1-foundation
      - fix/hotel-*
    paths: ['android-client/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android-debug-ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # v3 requests the removed SDK 'tools' package and fails before compilation.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify original resort logo bytes
        run: echo "3a1c4b7459df4555b1953cf54514462983bd2ec86453f21e153786df1d3c5c54  android-client/src/main/res/drawable-nodpi/aonang_fiore_logo.png" | sha256sum --check
      - name: Validate Android manifest XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('android-client/src/main/AndroidManifest.xml')"
      - name: Run backend contract tests
        run: python3 -m unittest discover -s backend -p 'test_*.py' -v
      - name: Build debug APK
        run: gradle --no-daemon :android-client:assembleDebug
      - name: Verify packaged APK identity and version
        shell: bash
        run: |
          set -euo pipefail
          APK="android-client/build/outputs/apk/debug/android-client-debug.apk"
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/hotel-apk-badging.txt
          grep -Eq "^package: name='net\\.velalab\\.tvhotel' versionCode='2' versionName='0\\.1\\.1'" /tmp/hotel-apk-badging.txt
          mkdir -p pilot-artifacts
          cp "$APK" pilot-artifacts/Vela-TV-Hotel-v0.1.1-FOCUS-QA-debug.apk
          sha256sum pilot-artifacts/*.apk | tee pilot-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-TV-Hotel-v0.1.1-FOCUS-QA-commit-${{ github.sha }}
          path: pilot-artifacts/
          if-no-files-found: error
