name: Hotel Android Debug CI
on:
  push:
    branches:
      - 'develop/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # v3 requests the removed SDK 'tools' package and fails before compilation.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install pinned schema test dependency
        run: python3 -m pip install -r backend/requirements-test.txt
      - name: Verify original resort logo bytes
        run: echo "3a1c4b7459df4555b1953cf54514462983bd2ec86453f21e153786df1d3c5c54  android-client/src/main/res/drawable-nodpi/aonang_fiore_logo.png" | sha256sum --check
      - name: Validate Android manifest XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('android-client/src/main/AndroidManifest.xml')"
      - name: Run backend contract tests
        run: python3 -m unittest discover -s backend -p 'test_*.py' -v
      - name: Verify Fiore24 Internal QA assets
        run: |
          test ! -d android-client/src/main/assets/fiore_internal
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('media/fiore-approved/assets/fiore_approved')
          images = json.loads((root / 'index.json').read_text())['images']
          assert len(images) == 24
          for image in images:
              assert hashlib.sha256((root / image['asset']).read_bytes()).hexdigest() == image['export_sha256']
          PY
      - name: Compile, test and build debug QA APK
        run: gradle --no-daemon -PincludeApprovedFioreMedia=true :android-client:compileDebugKotlin :android-client:testDebugUnitTest :android-client:assembleDebug
      - name: Verify actual APK identity, version and unique filename
        shell: bash
        run: |
          set -euo pipefail
          APK="android-client/build/outputs/apk/debug/android-client-debug.apk"
          test -s "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep '^package:'
          "$AAPT" dump badging "$APK" | grep -E "^package: name='net.velalab.tvhotel' versionCode='19' versionName='1.1.4'"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('android-client/build/outputs/apk/debug/android-client-debug.apk')
          with ZipFile(apk) as archive:
              assert archive.read('assets/hotel_content.json') == Path('android-client/src/main/assets/hotel_content.json').read_bytes()
              menu = json.loads(archive.read('assets/hotel_content.json'))['room_service']
              assert menu['currency'] == 'THB' and menu['contact'] == '4003'
              numbers = [item['number'] for category in menu['categories'] for item in category['items']]
              assert len(numbers) == 81 and set(range(1, 84)) - set(numbers) == {37, 38}
              art_root = Path('android-client/src/main/assets/room_service_art')
              art = json.loads(archive.read('assets/room_service_art/index.json'))
              assert art['kind'] == 'ai_generated_promotional_illustration'
              assert len(art['assets']) == 14
              for entry in art['assets']:
                  data = archive.read('assets/room_service_art/' + entry['asset'])
                  assert data == (art_root / entry['asset']).read_bytes()
                  assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
                  assert len(data) == entry['bytes']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']
              item_root = Path('android-client/src/main/assets/room_service_items')
              item_art = json.loads(archive.read('assets/room_service_items/index.json'))
              assert len(item_art['images']) == 81
              assert {entry['number'] for entry in item_art['images']} == set(numbers)
              assert len({entry['sha256'] for entry in item_art['images']}) == 81
              approved = {item['number']: item for category in menu['categories'] for item in category['items']}
              for entry in item_art['images']:
                  n = entry['number']
                  assert entry['asset'] == f'item_{n:03d}.webp'
                  assert (entry['name_en'], entry['name_th']) == (approved[n]['name_en'], approved[n]['name_th'])
                  data = archive.read('assets/room_service_items/' + entry['asset'])
                  assert data == (item_root / entry['asset']).read_bytes()
                  assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
                  assert len(data) == entry['bytes']
                  assert hashlib.sha256(data).hexdigest() == entry['sha256']
              index = json.loads(archive.read('assets/fiore_approved/index.json'))
              assert len(index['images']) == 24
              for image in index['images']:
                  asset = archive.read('assets/fiore_approved/' + image['asset'])
                  assert hashlib.sha256(asset).hexdigest() == image['export_sha256']
          print('Approved offline seed, 81 item images, 14 category images, room service menu and Fiore24 verified in Internal QA APK')
          PY
          mkdir -p dist
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          cp "$APK" dist/Vela-TV-Hotel-v1.1.4-code19-${SOURCE_SHA:0:7}-Fiore24-debug.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          printf 'source_commit=%s\nversion_name=1.1.4\nversion_code=19\nasset_profile=internal_qa_fiore24\n' "$SOURCE_SHA" > dist/BUILD-IDENTITY.txt
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > dist/CI-SIGNING-CERT.txt
          test -s dist/CI-SIGNING-CERT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-TV-Hotel-V1.1.4-FIORE24-INTERNAL-QA-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
