name: Hotel Android Debug CI
on:
  push:
    branches:
      - develop/hotel-v0.1-foundation
      - fix/hotel-*
    paths: ['android-client/**', '*.gradle.kts', 'gradle.properties', '.github/workflows/android-debug-ci.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # v3 requests the removed SDK 'tools' package and fails before compilation.
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Android manifest XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('android-client/src/main/AndroidManifest.xml')"
      - name: Run backend contract tests
        run: python3 -m unittest discover -s backend -p 'test_*.py' -v
      - name: Build debug APK
        run: gradle --no-daemon :android-client:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-TV-Hotel-V0.1-DEBUG-PILOT
          path: android-client/build/outputs/apk/debug/*.apk
          if-no-files-found: error
